name: Deploy to production

on:
  workflow_dispatch: {}

# write is needed only to push the prod-* tag after a successful deploy.
permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # "Run workflow" lets you pick any branch or tag, and whatever is picked
      # would go live. Fail loudly instead of publishing a feature branch by
      # mistake. prod-* tags are allowed because only this workflow creates
      # them, and only from main — picking one is how you roll back.
      - name: Refuse to deploy anything but main or a prod-* tag
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/prod-')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Production deploys only from main or a prod-* tag (got $REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      # local_path is './*', so anything in the repo root ends up publicly
      # readable on the server. These two are documentation, not the site.
      - name: Drop repo-only files from the upload
        run: rm -f README.md CLAUDE.md

      # css/ and js/ are cached for a week, the HTML pages are not, so a returning
      # visitor would pair fresh HTML with stale assets unless the URLs change.
      # The sha changes exactly when the code does — and a rollback re-stamps
      # the old sha, so the restored HTML points at the assets it shipped with.
      - name: Stamp asset URLs with the commit sha
        run: |
          # Every page, subdirectories included — a new one shipping with
          # ?v=dev intact would serve a stale cached stylesheet forever.
          shopt -s globstar
          for f in **/*.html; do
            sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" "$f"
            if grep -q '?v=dev' "$f"; then
              echo "::error::?v=dev survived the rewrite in $f"
              exit 1
            fi
            # grep -c exits 1 on zero matches; || true keeps the message readable.
            COUNT=$(grep -c "?v=${GITHUB_SHA::8}" "$f") || true
            if [ "$COUNT" -eq 0 ]; then
              echo "::error::no asset URLs were stamped in $f"
              exit 1
            fi
            echo "stamped $COUNT asset URLs in $f"
          done

      # Pinned to the commit behind v1.2.4: this action receives the SFTP
      # password, and a tag can be moved by the upstream author.
      - name: Deploy to production via SFTP
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/home/aikido/domains/aikido.pruszkow.pl/private_html'
          sftp_only: true
          delete_remote_files: false

      # Runs after the upload, so a failed deploy leaves no tag claiming to be
      # live. Skipped when deploying a tag, or a rollback would tag itself.
      # Lightweight tag on purpose: no committer identity to configure.
      - name: Tag the deployed commit
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="prod-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::8}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "::notice::Deployed as $TAG — pick it in Run workflow to roll back"
